<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voice Assistant</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-2: #1e293b;
    --fg: #e2e8f0;
    --muted: #64748b;
    --accent: #3b82f6;
    --user: #2563eb;
    --assist: #475569;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: var(--bg-2);
    border-bottom: 1px solid #334155;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .controls { margin-left: auto; display: flex; gap: 8px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: #334155; }
  button.danger { background: var(--red); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--user);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    background: var(--assist);
    color: var(--fg);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .role-tag { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

  footer {
    background: var(--bg-2);
    border-top: 1px solid #334155;
    padding: 20px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s, transform 0.2s;
  }
  .dot.listening { background: var(--green); animation: pulse 1.2s ease-in-out infinite; }
  .dot.speaking-detected { background: var(--yellow); }
  .dot.processing { background: var(--accent); animation: spin 1s linear infinite; }
  .dot.playing { background: var(--green); }
  .dot.error { background: var(--red); }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes spin {
    0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }
  }
  .meter {
    flex: 1;
    height: 6px;
    background: #1e293b;
    border-radius: 3px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.05s linear;
  }
</style>
</head>
<body>

<header>
  <h1>🎙️ Voice Assistant</h1>
  <span class="sub">Parakeet · Gemini 3.5 Flash · Piper</span>
  <div class="controls">
    <button id="startBtn">Start conversation</button>
    <button id="stopBtn" class="danger" disabled>Stop</button>
    <button id="resetBtn" class="secondary">Clear chat</button>
  </div>
</header>

<div id="chat"></div>

<footer>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">Click "Start conversation" to begin</span>
  </div>
  <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
</footer>

<script>
// ─── Config ────────────────────────────────────────────────
const SILENCE_THRESHOLD = 0.012;     // RMS energy below this = silence
const MIN_SPEECH_MS     = 300;       // ignore blips shorter than this
const SILENCE_HOLD_MS   = 1000;      // ms of silence to end utterance
const SAMPLE_RATE       = 16000;
const CHUNK_MS          = 50;        // frame size

// ─── State ─────────────────────────────────────────────────
let audioCtx, micStream, processor, source;
let running = false, processing = false, playingAudio = false;
let speechStartMs = null, lastVoiceMs = null;
let bufferChunks = [];
let currentAudio = null;

// ─── UI helpers ─────────────────────────────────────────────
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const meterFill = document.getElementById("meterFill");
const chat = document.getElementById("chat");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const resetBtn = document.getElementById("resetBtn");

function setStatus(klass, text) {
  dot.className = "dot " + (klass || "");
  statusText.textContent = text;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="role-tag">${role}</div>${text}`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ─── Mic capture + VAD ──────────────────────────────────────
async function startConversation() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });
  } catch (e) {
    setStatus("error", "Mic permission denied");
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  source = audioCtx.createMediaStreamSource(micStream);
  const chunkSamples = Math.round(SAMPLE_RATE * CHUNK_MS / 1000);

  // Use ScriptProcessorNode for broad compatibility (works without AudioWorklet)
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  source.connect(processor);
  processor.connect(audioCtx.destination);

  running = true;
  bufferChunks = [];
  speechStartMs = null;
  lastVoiceMs = null;

  processor.onaudioprocess = (ev) => {
    if (!running || processing || playingAudio) {
      meterFill.style.width = "0%";
      return;
    }
    const input = ev.inputBuffer.getChannelData(0);
    const chunk = new Float32Array(input);

    // RMS energy
    let sum = 0;
    for (let i = 0; i < chunk.length; i++) sum += chunk[i] * chunk[i];
    const rms = Math.sqrt(sum / chunk.length);
    meterFill.style.width = Math.min(100, rms * 1500) + "%";

    const now = performance.now();
    const isVoice = rms > SILENCE_THRESHOLD;

    if (isVoice) {
      if (speechStartMs === null) speechStartMs = now;
      lastVoiceMs = now;
      bufferChunks.push(chunk);
      setStatus("speaking-detected", "Listening (you're speaking) …");
    } else if (speechStartMs !== null) {
      // post-speech silence
      bufferChunks.push(chunk);
      if (now - lastVoiceMs > SILENCE_HOLD_MS) {
        // End of utterance
        if (now - speechStartMs >= MIN_SPEECH_MS) {
          flushBuffer();
        } else {
          // too short - probably noise
          bufferChunks = [];
          speechStartMs = null;
          lastVoiceMs = null;
        }
      }
    } else {
      setStatus("listening", "Listening …");
    }
  };

  startBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus("listening", "Listening …");
}

function stopConversation() {
  running = false;
  if (processor) { processor.disconnect(); processor = null; }
  if (source) { source.disconnect(); source = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  bufferChunks = [];
  startBtn.disabled = false;
  stopBtn.disabled = true;
  meterFill.style.width = "0%";
  setStatus("", "Stopped");
}

async function flushBuffer() {
  const chunks = bufferChunks;
  bufferChunks = [];
  speechStartMs = null;
  lastVoiceMs = null;

  processing = true;
  setStatus("processing", "Thinking …");

  // Concatenate all Float32Arrays
  const totalLen = chunks.reduce((a, c) => a + c.length, 0);
  const merged = new Float32Array(totalLen);
  let offset = 0;
  for (const c of chunks) { merged.set(c, offset); offset += c.length; }

  // Convert to WAV
  const wav = floatArrayToWav(merged, SAMPLE_RATE);
  const fd = new FormData();
  fd.append("audio", new Blob([wav], { type: "audio/wav" }), "speech.wav");

  try {
    const r = await fetch("/api/process", { method: "POST", body: fd });
    const data = await r.json();

    if (data.skip) {
      processing = false;
      setStatus("listening", "Listening …");
      return;
    }

    addMessage("user", data.user_text);
    addMessage("assistant", data.reply_text);

    // Play TTS audio
    playingAudio = true;
    setStatus("playing", "Speaking …");
    const audioBlob = b64ToBlob(data.audio_b64, "audio/wav");
    const url = URL.createObjectURL(audioBlob);
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      URL.revokeObjectURL(url);
      playingAudio = false;
      processing = false;
      if (running) setStatus("listening", "Listening …");
    };
    currentAudio.onerror = () => {
      playingAudio = false;
      processing = false;
      setStatus("error", "Playback error");
    };
    await currentAudio.play();
  } catch (e) {
    console.error(e);
    processing = false;
    setStatus("error", "Error: " + e.message);
    setTimeout(() => { if (running) setStatus("listening", "Listening …"); }, 2000);
  }
}

// ─── WAV encoding ───────────────────────────────────────────
function floatArrayToWav(floatArr, sampleRate) {
  const pcm16 = new Int16Array(floatArr.length);
  for (let i = 0; i < floatArr.length; i++) {
    let s = Math.max(-1, Math.min(1, floatArr[i]));
    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const dataSize = pcm16.length * 2;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const writeString = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
  writeString(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);            // PCM
  view.setUint16(22, 1, true);            // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, dataSize, true);
  for (let i = 0; i < pcm16.length; i++) view.setInt16(44 + i * 2, pcm16[i], true);
  return new Uint8Array(buffer);
}

function b64ToBlob(b64, mime) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// ─── Buttons ────────────────────────────────────────────────
startBtn.onclick = startConversation;
stopBtn.onclick = stopConversation;
resetBtn.onclick = async () => {
  await fetch("/api/reset", { method: "POST" });
  chat.innerHTML = "";
};

// Load existing history on page open
fetch("/api/history").then(r => r.json()).then(turns => {
  turns.forEach(t => addMessage(t.role, t.text));
});
</script>
</body>
</html>
